services:
  # ============================================================================
  # RoomSketch Backend Service (Spring Boot 3 + Java 21)
  # ============================================================================
  - type: web
    name: roomsketch-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: roomsketch-db
          property: connectionString
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com,http://localhost:3000

  # ============================================================================
  # RoomSketch Main Web Application (Next.js 14 App Router)
  # Public Domain: https://roomsketch.onrender.com
  # ============================================================================
  - type: web
    name: roomsketch
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BACKEND_URL
        value: https://roomsketch-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://roomsketch.onrender.com/api

# ==============================================================================
# Managed PostgreSQL Database
# ==============================================================================
databases:
  - name: roomsketch-db
    databaseName: roomsketch_db
    user: roomsketch_user
    plan: free
    region: oregon
